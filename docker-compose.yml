version: "3.9"
services:
  link-manager:
    build: .
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - link_data:/data
    environment:
      - LINK_ADMIN_TOKEN=${LINK_ADMIN_TOKEN:-changeme}
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  link_data:
